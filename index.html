<head>

<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf0f3}
  iframe{border:0;width:100%;height:100vh;height:100dvh;display:block}
  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
           gap:14px;background:#fdf0f3;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;color:#d95a75;font-size:15px}
  #loading img{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 18px rgba(240,122,146,.25)}
  .dots span{display:inline-block;width:7px;height:7px;margin:0 3px;border-radius:50%;background:#f07a92;animation:b 1s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
</style>
</head>
<body>
  <div id="loading">
    <img src="icon-192.png" alt="">
    <div>자원봉사 활동일지를 여는 중이에요</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <iframe id="app" title="자원봉사 활동일지"
    src="https://script.google.com/a/macros/sillym.or.kr/s/AKfycbwcnVU1pqUOw1t3u24FeItEaRKAwsE3OZxGOCu4dvc5n6dtSZHXWDA4PHyjp4eGYEU7/exec"
    onload="document.getElementById('loading').style.display='none'"></iframe>
</body>
